version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sportbooker-postgres
    environment:
      POSTGRES_DB: sportbooker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sportbooker"]
      interval: 2s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sportbooker-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com 
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"  # افتح على المتصفح http://localhost:5050
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: